# Coolify: Docker Compose build pack, this file. Both daemons start locked:
#   hoisty init      once, in the bot's terminal
#   hoisty unlock    in the bot's terminal after every start
# Web UI over a tunnel by default: ssh -L 8443:127.0.0.1:8443 <server>, then https://localhost:8443
# Behind Coolify's proxy instead: HOISTY_WEB_PROXY=1 and the web domain https://<host>:8443.
# That hop is plain HTTP, so leave "Connect to Predefined Network" off: only the
# proxy, bot and web may share this stack's network.
# The same hardening as deploy/hoisty@.service, written out twice: Coolify's
# parser is not trusted with YAML anchors.
services:
  bot:
    build: .
    command: [bot]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /run/hoisty:uid=65532,gid=65532,mode=0700
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, DAC_OVERRIDE, KILL]
    security_opt: ["no-new-privileges:true"]
    ulimits:
      core: 0
      memlock: 67108864
    volumes:
      - hoisty-data:/var/lib/hoisty/data
      - hoisty-backups:/var/lib/hoisty/backups
      - hoisty-projects:/var/lib/hoisty/projects

  web:
    build: .
    command: [web]
    environment:
      - HOISTY_WEB_PROXY=${HOISTY_WEB_PROXY:-}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /run/hoisty:uid=65532,gid=65532,mode=0700
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, DAC_OVERRIDE, KILL]
    security_opt: ["no-new-privileges:true"]
    ulimits:
      core: 0
      memlock: 67108864
    ports:
      - 127.0.0.1:8443:8443
    volumes:
      - hoisty-data:/var/lib/hoisty/data
      - hoisty-backups:/var/lib/hoisty/backups
      - hoisty-projects:/var/lib/hoisty/projects

volumes:
  hoisty-data:
  hoisty-backups:
  hoisty-projects:
